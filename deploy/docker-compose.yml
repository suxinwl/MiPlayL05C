services:
  oo-music:
    image: ghcr.io/suxinwl/oo-music:latest
    pull_policy: always
    container_name: oo-music-backend
    restart: unless-stopped
    env_file:
      - ../oo-music/backend/.env
    environment:
      OO_MUSIC_ADDR: 0.0.0.0:8787
      OO_MUSIC_DB_PATH: /data/oo-music.db
      OO_MUSIC_WEB_DIST: /app/web
    ports:
      - "8787:8787"
    volumes:
      - oo-music-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - xiaomi

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    pull_policy: always
    container_name: xiaomi-gateway
    restart: unless-stopped
    env_file:
      - ../xiaomi-gateway/.env
    environment:
      OO_MUSIC_BASE_URL: http://oo-music:8787
    ports:
      - "58092:58092"
    volumes:
      - gateway-config:/config
    depends_on:
      oo-music:
        condition: service_healthy
    networks:
      - xiaomi

volumes:
  oo-music-data:
  gateway-config:

networks:
  xiaomi:
    driver: bridge
