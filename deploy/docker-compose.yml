services:
  lxserver:
    image: xcq0607/lxserver:latest
    pull_policy: always
    container_name: lx-sync-server
    restart: unless-stopped
    ports:
      - "9527:9527"
    volumes:
      - lxserver-data:/server/data
      - lxserver-cache:/server/cache
      - lxserver-music:/server/music
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: "CHANGE_ME_LX_ADMIN_PASSWORD"
      ENABLE_WEBPLAYER_AUTH: "true"
      WEBPLAYER_PASSWORD: "CHANGE_ME_LX_WEBPLAYER_PASSWORD"
    networks:
      - xiaomi

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    pull_policy: always
    container_name: xiaomi-gateway
    restart: unless-stopped
    env_file:
      - ../xiaomi-gateway/.env
    environment:
      MUSIC_BACKEND: lxserver
      LXSERVER_BASE_URL: http://lxserver:9527
      MUSIC_SOURCE: kw
    ports:
      - "58092:58092"
    volumes:
      - gateway-config:/config
    depends_on:
      - lxserver
    networks:
      - xiaomi

volumes:
  lxserver-data:
  lxserver-cache:
  lxserver-music:
  gateway-config:

networks:
  xiaomi:
    driver: bridge
