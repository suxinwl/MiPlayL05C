# iKuai Docker Compose: no build directive is used.
# Images are built by GitHub Actions and published to GHCR.
services:
  oo-music:
    image: ghcr.io/suxinwl/oo-music:60e144a
    platform: linux/amd64
    container_name: miplayl05c-oo-music
    # iKuai creates bind-mounted directories as root. The image writes the
    # SQLite database and login state under /data on the trusted LAN.
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./oo-music-data:/data
    environment:
      OO_MUSIC_ADDR: "0.0.0.0:8787"
      OO_MUSIC_DB_PATH: /data/oo-music.db
      OO_MUSIC_WEB_DIST: /app/web
      OO_MUSIC_ADMIN_USERNAME: admin
      OO_MUSIC_ADMIN_PASSWORD: "Adsj201202"
      OO_MUSIC_ADMIN_USERNAME: "${OO_MUSIC_ADMIN_USERNAME}"
      OO_MUSIC_ADMIN_PASSWORD: "${OO_MUSIC_ADMIN_PASSWORD}"

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:8ee45c8
    platform: linux/amd64
    container_name: miplayl05c-xiaomi-gateway
    restart: unless-stopped
    ports:
      - "58092:58092"
    volumes:
      - ./gateway-config:/config
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "58092"
      # Container-to-container address. Browsers use http://192.168.8.1:8787.
      OO_MUSIC_BASE_URL: http://oo-music:8787
      MUSIC_SOURCE: qq
      MUSIC_QUALITY: 320mp3
      MUSIC_ALLOW_FALLBACK: "true"
      OO_MUSIC_CLIENT_ACCOUNT_ID: ""
      OO_MUSIC_CLIENT_ACCESS_KEY: ""
      MI_USER: "18038018206"
      MI_PASS: "Adsj201202"
      MI_DID: "91afebe2-13ef-49cf-8b57-8fd46e8f1f95"
      MI_TOKEN_PATH: /config/mi.token
      SPEAKER_HARDWARE: L05C
      SPEAKER_TTS_COMMAND: "5,3"
      STREAM_RESPONSE: "false"
      MI_LISTENER_ENABLED: "false"
      MI_POLL_INTERVAL: "1.0"
      MODEL_PROVIDER: deepseek
      MODEL_NAME: deepseek-chat
      MODEL_BASE_URL: https://api.deepseek.com
      MODEL_API_KEY: "请填写模型APIKey"
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      ARK_API_KEY: ""
    depends_on:
      - oo-music
