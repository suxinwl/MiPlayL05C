# iKuai Docker Compose: no build directive is used.
# lxserver is the music backend. The gateway uses the lxserver service name
# because both services are created by this Compose project.
services:
  lxserver:
    image: xcq0607/lxserver:latest
    platform: linux/amd64
    container_name: miplayl05c-lxserver
    restart: unless-stopped
    ports:
      - "9527:9527"
    volumes:
      - ./lxdata:/server/data
      - ./lxcache:/server/cache
      - ./lxmusic:/server/music
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: "CHANGE_ME_LX_ADMIN_PASSWORD"
      ENABLE_WEBPLAYER_AUTH: "true"
      WEBPLAYER_PASSWORD: "CHANGE_ME_LX_WEBPLAYER_PASSWORD"

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    platform: linux/amd64
    container_name: miplayl05c-xiaomi-gateway
    restart: unless-stopped
    ports:
      - "58092:58092"
    volumes:
      - ./gateway-config:/config
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "58092"

      # Music: lxserver native API. MUSIC_SOURCE values are kw/kg/tx/wy/mg.
      MUSIC_BACKEND: lxserver
      LXSERVER_BASE_URL: http://lxserver:9527
      LXSERVER_USER_NAME: "open"
      LXSERVER_USER_TOKEN: ""
      MUSIC_SOURCE: kw
      MUSIC_QUALITY: 320mp3
      MUSIC_ALLOW_FALLBACK: "true"

      # Xiaomi/MiService. Replace the CHANGE_ME values on the iKuai copy.
      MI_USER: "CHANGE_ME_XIAOMI_ACCOUNT"
      MI_PASS: "CHANGE_ME_XIAOMI_PASSWORD"
      MI_DID: "CHANGE_ME_DEVICE_ID"
      MI_MIOT_DID: "CHANGE_ME_MIOT_DID"
      MI_TOKEN_PATH: /config/mi.token
      SPEAKER_HARDWARE: L05C
      SPEAKER_TTS_COMMAND: "5,3"
      STREAM_RESPONSE: "false"
      MI_LISTENER_ENABLED: "false"
      MI_POLL_INTERVAL: "1.0"

      # AI: use the same OpenAI-compatible provider configured in xiaozhi-server.
      # The xiaozhi-esp32-server itself speaks WebSocket/MQTT to ESP32 devices;
      # it is not a direct HTTP /v1/chat/completions endpoint for this gateway.
      MODEL_PROVIDER: doubao
      MODEL_NAME: "CHANGE_ME_DOUBAO_MODEL_OR_ENDPOINT_ID"
      MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      MODEL_API_KEY: "CHANGE_ME_DOUBAO_API_KEY"
      ARK_API_KEY: ""
      XIAOZHI_API_KEY: ""

    depends_on:
      - lxserver

  # Optional legacy R1 media service. Remove this service if it is not used.
  # r1-media:
