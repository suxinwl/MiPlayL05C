# iKuai Docker Compose: lxserver is already deployed separately on 192.168.8.1:9527.
# This project adds the self-hosted xiaozhi server and the L05C gateway.
services:
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    platform: linux/amd64
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "8000:8000"
      - "8003:8003"
    volumes:
      - ./xiaozhi-data:/opt/xiaozhi-esp32-server/data
      - ./xiaozhi-models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt:ro
    command:
      - /bin/sh
      - -c
      - |
          cat > /opt/xiaozhi-esp32-server/data/.config.yaml <<'EOF'
          server:
            websocket: $${XIAOZHI_WEBSOCKET}
          prompt: |
            你是小智，回答简洁、自然，适合语音播报。
            不要输出 Markdown 表格、链接或特殊格式。
          selected_module:
            LLM: DoubaoLLM
          LLM:
            DoubaoLLM:
              type: openai
              base_url: $${XIAOZHI_MODEL_BASE_URL}
              model_name: $${XIAOZHI_MODEL_NAME}
              api_key: $${XIAOZHI_API_KEY}
              temperature: 0.7
              max_tokens: 500
          EOF
          exec python app.py
    environment:
      TZ: Asia/Shanghai
      XIAOZHI_WEBSOCKET: ws://192.168.8.1:8000/xiaozhi/v1/
      XIAOZHI_MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      XIAOZHI_MODEL_NAME: "CHANGE_ME_DOUBAO_MODEL_OR_ENDPOINT_ID"
      XIAOZHI_API_KEY: "CHANGE_ME_DOUBAO_API_KEY"

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    platform: linux/amd64
    container_name: miplayl05c-xiaomi-gateway
    restart: unless-stopped
    ports:
      - "58092:58092"
    volumes:
      - ./gateway-config:/config
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "58092"

      # lxserver already runs in another iKuai Compose project.
      MUSIC_BACKEND: lxserver
      LXSERVER_BASE_URL: http://192.168.8.1:9527
      LXSERVER_USER_NAME: "open"
      LXSERVER_USER_TOKEN: ""
      MUSIC_SOURCE: kw
      MUSIC_QUALITY: 320mp3
      MUSIC_ALLOW_FALLBACK: "true"

      # Xiaomi/MiService. Replace the CHANGE_ME values locally on iKuai.
      MI_USER: "CHANGE_ME_XIAOMI_ACCOUNT"
      MI_PASS: "CHANGE_ME_XIAOMI_PASSWORD"
      MI_DID: "CHANGE_ME_DEVICE_ID"
      MI_MIOT_DID: "CHANGE_ME_MIOT_DID"
      MI_TOKEN_PATH: /config/mi.token
      SPEAKER_HARDWARE: L05C
      SPEAKER_TTS_COMMAND: "5,3"
      STREAM_RESPONSE: "false"
      MI_LISTENER_ENABLED: "false"
      MI_POLL_INTERVAL: "1.0"

      # Keep these values identical to the XIAOZHI_* variables above.
      # xiaozhi-esp32-server itself uses WebSocket/MQTT for ESP32 devices;
      # it is not used here as an HTTP /v1/chat/completions endpoint.
      MODEL_PROVIDER: doubao
      MODEL_NAME: "CHANGE_ME_DOUBAO_MODEL_OR_ENDPOINT_ID"
      MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      MODEL_API_KEY: "CHANGE_ME_DOUBAO_API_KEY"
      ARK_API_KEY: ""
      XIAOZHI_API_KEY: ""
