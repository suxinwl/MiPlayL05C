services:
  lxserver:
    image: xcq0607/lxserver:latest
    pull_policy: always
    container_name: lx-sync-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: "CHANGE_ME_LX_ADMIN_PASSWORD"
      ENABLE_WEBPLAYER_AUTH: "true"
      WEBPLAYER_PASSWORD: "CHANGE_ME_LX_WEBPLAYER_PASSWORD"
    ports:
      - "9527:9527"
    volumes:
      - /volume1/docker/xiaoai-music/runtime/lxdata:/server/data
      - /volume1/docker/xiaoai-music/runtime/lxcache:/server/cache
      - /volume1/docker/xiaoai-music/runtime/lxmusic:/server/music
    networks:
      - xiaomi

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    pull_policy: always
    container_name: xiaomi-gateway
    restart: unless-stopped
    env_file:
      - /volume1/docker/xiaoai-music/xiaomi-gateway/.env
    environment:
      MUSIC_BACKEND: lxserver
      LXSERVER_BASE_URL: http://lxserver:9527
      MUSIC_SOURCE: kw
      MI_TOKEN_PATH: /config/mi.token
    ports:
      - "58092:58092"
    volumes:
      - /volume1/docker/xiaoai-music/runtime/gateway:/config
    depends_on:
      - lxserver
    networks:
      - xiaomi

networks:
  xiaomi:
    driver: bridge
