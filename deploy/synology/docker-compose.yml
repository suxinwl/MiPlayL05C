services:
  oo-music:
    image: ghcr.io/suxinwl/oo-music:latest
    pull_policy: always
    container_name: oo-music-backend
    restart: unless-stopped
    env_file:
      - /volume1/docker/xiaoai-music/oo-music/backend/.env
    environment:
      OO_MUSIC_ADDR: 0.0.0.0:8787
      OO_MUSIC_DB_PATH: /data/oo-music.db
      OO_MUSIC_WEB_DIST: /app/web
    ports:
      - "8787:8787"
    volumes:
      - /volume1/docker/xiaoai-music/runtime/oo-music:/data
    networks:
      - xiaomi

  xiaomi-gateway:
    image: ghcr.io/suxinwl/xiaomi-gateway:latest
    pull_policy: always
    container_name: xiaomi-gateway
    restart: unless-stopped
    env_file:
      - /volume1/docker/xiaoai-music/xiaomi-gateway/.env
    environment:
      OO_MUSIC_BASE_URL: http://oo-music:8787
      MI_TOKEN_PATH: /config/.mi.token
    ports:
      - "58092:58092"
    volumes:
      - /volume1/docker/xiaoai-music/runtime/gateway:/config
    depends_on:
      - oo-music
    networks:
      - xiaomi

networks:
  xiaomi:
    driver: bridge
